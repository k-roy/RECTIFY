<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"
     role="img" aria-label="RECTIFY">
  <rect width="256" height="256" fill="#ffffff" />
  <!-- baseline -->
  <line x1="22" y1="180" x2="234" y2="180"
        stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round" />
  <line x1="44" y1="178" x2="44" y2="182" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round" /><line x1="76" y1="178" x2="76" y2="182" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round" /><line x1="108" y1="178" x2="108" y2="182" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round" />
  <line x1="180" y1="177" x2="180" y2="184" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round" />
  <!-- echo of the noisy trace, lighter, to suggest stacked uncorrected reads -->
  <path d="M 24,180 Q 30,180 34,170 Q 39,156 45,168 Q 51,180 56,172 Q 62,160 66,146 Q 72,160 76,168 Q 82,180 86,164 Q 90,148 96,134 Q 102,150 106,150 Q 110,150 114,158 Q 120,172 126,180 L 132,180" fill="none"
        stroke="#94a3b8" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"
        transform="translate(0,6) scale(1,0.78)"
        transform-origin="78 180"
        opacity="0.55" />
  <!-- primary noisy trace -->
  <path d="M 24,180 Q 30,180 34,170 Q 39,156 45,168 Q 51,180 56,172 Q 62,160 66,146 Q 72,160 76,168 Q 82,180 86,164 Q 90,148 96,134 Q 102,150 106,150 Q 110,150 114,158 Q 120,172 126,180 L 132,180" fill="none"
        stroke="#64748b" stroke-width="2.6"
        stroke-linejoin="round" stroke-linecap="round" />
  <!-- rectified spike -->
  <path d="M 168,180 L 180,58 L 192,180 Z"
        fill="#0d9488"
        stroke="#0f766e" stroke-width="2"
        stroke-linejoin="round" />
  <!-- anchor mark just below baseline at the CPA position -->
  <path d="M 176,184 L 180,194 L 184,184 Z" fill="#0f766e" />
</svg>
