<text fill="#d97706" font-size="8.5" x="418" y="296">2. read A = ref A → walk inward</text>
<text fill="#dc2626" font-size="8.5" x="418" y="310">3. mismatch → walk inward</text>
<text fill="#64748b" font-size="8" font-style="italic" x="418" y="324">Stop: read == ref AND ref ≠ A</text>

