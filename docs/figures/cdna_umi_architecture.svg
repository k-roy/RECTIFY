<text fill="#2563eb" font-size="8" x="58" y="309">XY:Z=1a</text>
<rect x="276" y="250" width="106" height="22" rx="4" fill="#6366f1" opacity="0.18"/><rect x="276" y="250" width="106" height="22" rx="4" fill="none" stroke="#6366f1" stroke-width="1"/><text fill="#6366f1" font-size="10" font-weight="600" text-anchor="middle" x="329.0" y="265.0">cDNA</text>
<rect x="382" y="250" width="50" height="22" rx="4" fill="#2563eb"/><text fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" x="407.0" y="265.0">UMI</text>
<rect x="432" y="250" width="44" height="22" rx="4" fill="#6366f1"/><text fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" x="454.0" y="265.0">SSP</text>
