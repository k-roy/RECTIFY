<text fill="#2563eb" font-size="8" font-weight="600" text-anchor="middle" x="188" y="115">XU:Z → UMI</text>
<text fill="#94a3b8" font-size="7.5" text-anchor="middle" x="150" y="128">(TT-VVVV)×4+TTT</text>
