<text fill="#059669" font-size="8" font-weight="600" text-anchor="middle" x="580" y="115">XA:i → poly(A)</text>
<text fill="#0d9488" font-size="7.5" text-anchor="middle" x="282" y="128">XQ:i (5′ stripped)</text>
<text fill="#0d9488" font-size="7.5" text-anchor="middle" x="540" y="128">XK:i (3′ stripped)</text>
