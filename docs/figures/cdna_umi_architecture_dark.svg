<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320">
<rect fill="#0f172a" width="760" height="320"/>
<g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<text fill="#f1f5f9" font-size="14" font-weight="700" text-anchor="middle" x="380.0" y="26">ONT PCR-cDNA read architecture (SQK-PCB114.24)</text>
<text fill="#64748b" font-size="11" font-weight="400" text-anchor="middle" x="380.0" y="44">both strands of each amplicon are sequenced — Dorado does not reverse-complement</text>
<text fill="#2dd4bf" font-size="11" font-weight="700" text-anchor="start" x="80" y="86">orient = fwd   (≈50% of reads)</text>
<text fill="#64748b" font-size="11" font-weight="400" text-anchor="end" x="80" y="111.0">5′</text>
<rect x="111.0" y="92" width="80" height="30" rx="4" fill="#172554" stroke="#60a5fa" stroke-width="1.2"/>
<text fill="#60a5fa" font-size="12" font-weight="600" text-anchor="middle" x="151.0" y="111.0">SSP</text>
<rect x="191.0" y="92" width="90" height="30" rx="4" fill="#3b0764" stroke="#c084fc" stroke-width="1.2"/>
<text fill="#c084fc" font-size="12" font-weight="600" text-anchor="middle" x="236.0" y="111.0">UMI (27 nt)</text>
<rect x="281.0" y="92" width="32" height="30" rx="4" fill="#431407" stroke="#fb923c" stroke-width="1.2"/>
<text fill="#fb923c" font-size="12" font-weight="600" text-anchor="middle" x="297.0" y="111.0">GGG</text>
<rect x="313.0" y="92" width="260" height="30" rx="4" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.2"/>
<text fill="#2dd4bf" font-size="12" font-weight="600" text-anchor="middle" x="443.0" y="111.0">mRNA</text>
<rect x="573.0" y="92" width="100" height="30" rx="4" fill="#052e16" stroke="#4ade80" stroke-width="1.2"/>
<text fill="#4ade80" font-size="12" font-weight="600" text-anchor="middle" x="623.0" y="111.0">poly(A)</text>
<text fill="#64748b" font-size="11" font-weight="400" text-anchor="start" x="679.0" y="111.0">3′</text>
<path d="M191.0,126 L191.0,131 L281.0,131 L281.0,126" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.7"/>
<text fill="#c084fc" font-size="11" font-weight="600" text-anchor="middle" x="236.0" y="143">(TT-VVVV) x 4 + TTT   V = A / C / G</text>
<text fill="#fb923c" font-size="11" font-weight="700" text-anchor="start" x="80" y="214">orient = rev   (≈50% of reads)</text>
<text fill="#64748b" font-size="11" font-weight="400" text-anchor="end" x="80" y="239.0">5′</text>
<rect x="111.0" y="220" width="100" height="30" rx="4" fill="#052e16" stroke="#4ade80" stroke-width="1.2"/>
<text fill="#4ade80" font-size="12" font-weight="600" text-anchor="middle" x="161.0" y="239.0">poly(T)</text>
<rect x="211.0" y="220" width="260" height="30" rx="4" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.2"/>
<text fill="#2dd4bf" font-size="12" font-weight="600" text-anchor="middle" x="341.0" y="239.0">mRNA (RC)</text>
<rect x="471.0" y="220" width="32" height="30" rx="4" fill="#431407" stroke="#fb923c" stroke-width="1.2"/>
<text fill="#fb923c" font-size="12" font-weight="600" text-anchor="middle" x="487.0" y="239.0">CCC</text>
<rect x="503.0" y="220" width="90" height="30" rx="4" fill="#3b0764" stroke="#c084fc" stroke-width="1.2"/>
<text fill="#c084fc" font-size="12" font-weight="600" text-anchor="middle" x="548.0" y="239.0">UMI_RC (27 nt)</text>
<rect x="593.0" y="220" width="80" height="30" rx="4" fill="#172554" stroke="#60a5fa" stroke-width="1.2"/>
<text fill="#60a5fa" font-size="12" font-weight="600" text-anchor="middle" x="633.0" y="239.0">SSP_RC</text>
<text fill="#64748b" font-size="11" font-weight="400" text-anchor="start" x="679.0" y="239.0">3′</text>
<text fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle" x="380.0" y="290">rectify correct-cdna strips SSP/UMI/GGG and poly(A/T) from both, but does NOT reorient: each consensus keeps its basecalled orientation and is labelled XO:Z:fwd|rev</text>
</g>
</svg>