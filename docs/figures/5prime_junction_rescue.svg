<text fill="#0d9488" font-size="10" font-weight="600" text-anchor="middle" x="550.0" y="148.0">aligned</text>
<text fill="#dc2626" font-size="8.5" font-weight="600" text-anchor="middle" x="210.0" y="124">bases actually match Exon 1</text>
<text fill="#64748b" font-size="10" font-weight="400" text-anchor="end" x="120" y="200.0">Read (rescued)</text>
