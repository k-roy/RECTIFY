<text x="184.0" y="387.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#059669">Read-vs-reference walkback   (rectify/core/correct/walkback.py)</text>
<text x="184.0" y="412.0" font-size="10" font-weight="normal" text-anchor="start" fill="#334155">3-case terminal gate:  (1) non-A anchored → no correction   (2) read-A &amp; genome-A → walk inward   (3) mismatch → walk to first non-A read=ref</text>
<text x="184.0" y="427.0" font-size="10" font-weight="normal" text-anchor="start" fill="#334155">walkback_drs (3′=right, RNA=BAM)   ·   cdna-analyze recompute   ·   walkback_quantseq_rev (3′=left, RNA inverted)</text>
