[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rectify-rna"
version = "0.9.0"
description = "RNA 5' and 3' End Correction Tool with Intron Refinement and Ambiguity Resolution"
authors = [
    {name = "Kevin R. Roy", email = "kevinrjroy@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = [
    "RNA", "3-prime-end", "polyadenylation", "RNA-seq", "genomics",
    "nanopore", "direct RNA sequencing", "long-read",
    "Oxford Nanopore", "Oxford Nanopore Technologies", "ONT",
    "cleavage site", "splice junction", "multi-aligner",
    "NET-seq", "native elongating transcript sequencing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    # Core Python dependencies (always installed with pip install rectify-rna)
    "pysam>=0.19.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "pyBigWig>=0.3.18",
    "biopython>=1.79",
    "tqdm>=4.60.0",
    "pydeseq2>=0.4.0",
    "mappy>=2.24",           # Python bindings for minimap2 (required by gapmm2 + cdna_correct re-align)
    "intervaltree>=3.1",     # gene-interval lookups (correct-cdna sense/antisense classification)
    "rapidfuzz>=3.0",        # Levenshtein distance for UMI clustering (correct-cdna)
]

[project.optional-dependencies]
# Speed up Module 2H junction refinement DP by ~50× (requires LLVM):
#   pip install "rectify-rna[performance]"  or  conda install numba
performance = [
    "numba>=0.55.0",
]
# Optional cdna-correct extras — enables fuzzy adapter anchoring + POA consensus
# in `rectify correct-cdna`. Without these, the subcommand falls back to
# exact-match anchors and pileup-style consensus (still functional, just less robust).
cdna-correct = [
    "edlib>=1.3",            # Lev≤2 fuzzy HW alignment for adapter anchors (~95-97% vs 73% exact)
    "pyabpoa>=1.5",          # POA consensus when re-aligning multi-read clusters
]
# External binary tools — cannot be installed via pip; use conda/mamba:
#   mamba install -c bioconda minimap2 bbmap gapmm2 samtools htslib desalt meme
aligners = [
    # gapmm2 25.4.13+ regressed on the `ts:` tag check inside splice_aligner_minimap2:
    # 25.4.13 raises UnboundLocalError when minimap2 omits `ts:` (single-exon
    # alignments), and 25.8.12 silently drops all such reads via the missing-ts
    # skip path. Pin to 25.4.5 until upstream restores tolerance for non-spliced
    # alignments. See methods/h2_all_aligners_handoff.md.
    "gapmm2==25.4.5",        # minimap2 wrapper with edlib refinement (pip-installable)
]
junction-aligners = [
    "ultra-bioinformatics>=0.1",  # uLTRA annotation-guided aligner (pip-installable)
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    # Required by the cDNA validation suite (tests/test_validation_reads_cdna.py):
    # walk_back_anchor_and_tail uses edlib for fuzzy 3' adapter anchoring. Without
    # it, _find_adapter_anchor_pos returns None and the poly-A tail length is
    # over-counted via the 200 bp fallback window, breaking the locked baselines.
    "edlib>=1.3",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-autorefs>=0.5.0",
    "pymdown-extensions>=10.0",
]
visualize = [
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
]
# Binary conda-only dependencies (documented here for conda meta.yaml alignment):
#   - minimap2 >=2.24         (bioconda)
#   - bbmap >=39.0            (bioconda, provides mapPacBio.sh)
#   - samtools >=1.15         (bioconda)
#   - htslib >=1.15           (bioconda, provides bgzip)
#   - desalt >=1.5            (bioconda, optional tier-2 aligner)
#   - meme >=5.4.0            (bioconda, optional motif analysis)

[project.urls]
"Homepage" = "https://github.com/k-roy/RECTIFY"
"Documentation" = "https://rectify-rna.readthedocs.io"
"Bug Tracker" = "https://github.com/k-roy/RECTIFY/issues"
"Publication" = "https://pubmed.ncbi.nlm.nih.gov/31128237/"

[project.scripts]
rectify = "rectify.cli:main"

[tool.setuptools]
packages = ["rectify", "rectify.calibration", "rectify.core", "rectify.core.aggregate", "rectify.core.analyze", "rectify.core.classify", "rectify.utils", "rectify.data", "rectify.visualize"]

[tool.setuptools.package-data]
rectify = [
    "data/models/*.json",
    "data/*.tsv.gz",
    "data/genomes/**/*.gz",
    "data/motif_databases/*.meme",
    "data/output/validation_reads.bam",
    "data/output/validation_reads.bam.bai",
    "data/output/validation_reads.fastq.gz",
    "data/output/validation_reads_igv.html",
    "data/output/aligners/*.bam",
    "data/output/aligners/*.bai",
    "data/output/rectified/*.bam",
    "data/output/rectified/*.bai",
    "data/output/rectified/*.bedgraph",
    "data/VALIDATION_READS.md",
    "data/corrected_3ends.tsv",
    "data/corrected_3ends_stats.tsv",
    "data/corrected_3ends_index.bed.gz",
    "data/bin/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"'). Currently applies to the 3-stage cDNA pipeline smoke (~5 min on 40k reads) and the cDNA chain canary (~5 min, same pipeline with different assertions).",
]
# Coverage is opt-in. For a coverage run:
#   pytest --cov=rectify --cov-report=html --cov-report=term
# To skip slow tests (recommended for interactive / handoff sessions):
#   pytest -m "not slow"
# To parallelize across cores (requires pytest-xdist):
#   pytest -n auto -m "not slow"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
